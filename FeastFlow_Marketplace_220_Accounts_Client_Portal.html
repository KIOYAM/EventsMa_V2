function ffMktPlanRow(x){const p=ffMktProvider(x.providerId);return `<div class="ff-customer-request"><div class="logo">${p?ffMktLogo(p):'F'}</div><div class="info"><strong>${escapeHtml(x.packageName)}</strong><small>${escapeHtml(x.providerName)} · ${escapeHtml(x.vertical)}<br>${escapeHtml(x.city)} · Listed package ${ffMktAmount(x.price)}</small><div class="flex gap-8" style="margin-top:8px"><button class="btn btn-primary btn-sm" data-action="mkt-quote" data-id="${escapeHtml(x.providerId)}" data-package="${escapeHtml(x.packageId)}">Request quote</button><button class="btn btn-secondary btn-sm" data-action="mkt-view-provider" data-id="${escapeHtml(x.providerId)}">View shop</button><button class="btn btn-quiet btn-sm" data-action="mkt-remove-plan" data-id="${escapeHtml(x.id)}">Remove</button></div></div><span class="status draft">To compare</span></div>`}
function ffMktResetFilters(){ffMktFilters={query:'',city:'All India',vertical:'All services',eventType:'All occasions',cuisine:'All cuisines',budget:'Any budget',guests:'',sort:'recommended'};ffMktPage=1;ffMktSelectedId='';ffMktProfileTab='overview';setPage('marketplace')}
function ffMktSyncCurrentBusiness(){if(!ffActiveOrgId||!state.business)return;let p=ffMktProfiles.find(x=>x.orgId===ffActiveOrgId||x.id===ffActiveOrgId);if(!p){if(state.business.published!==false){const org=ffOrgs.find(o=>o.id===ffActiveOrgId);if(org){p=ffMktMakeProfile(org,700,state);ffMktProfiles.unshift(p)}}}if(p){const b=state.business;p.name=b.name||p.name;p.logoText=b.logoText||initials(p.name);p.brandLogo=b.brandLogo||'';p.brandFont=b.brandFont||'classic';p.brandSubtitle=b.brandSubtitle||b.serviceVerticals?.slice(0,2).join(' · ')||p.brandSubtitle;p.tagline=b.tagline||p.tagline;p.description=b.description||p.description;p.city=b.city||p.city;p.state=b.state||p.state;p.serviceAreas=b.serviceAreas||p.serviceAreas;p.serviceVerticals=(b.serviceVerticals||p.serviceVerticals).slice();p.serviceCount=p.serviceVerticals.length;p.eventTypes=(b.eventTypes||p.eventTypes).slice(0,30);p.cuisines=(b.cuisines||p.cuisines).slice(0,20);p.foodStyles=(b.foodStyles||p.foodStyles).slice(0,20);p.published=b.published!==false;p.cover=b.cover||p.cover;if(state.menus?.length)p.menus=state.menus.slice(0,20);const sw=state.serviceWorkspaces||{};let packages=[],resources=[],team=[],deliverables=[];p.serviceVerticals.forEach(v=>{const w=sw[v];if(w){packages.push(...(w.packages||[]).map(x=>({...x,vertical:v})));resources.push(...(w.resources||[]).map(x=>({...x,vertical:v})));team.push(...(w.team||[]).map(x=>({...x,vertical:v})));deliverables.push(...(w.deliverables||[]).map(x=>({...x,vertical:v})))}});if(packages.length)p.packages=packages;if(resources.length)p.resources=resources;if(team.length)p.team=team;if(deliverables.length)p.deliverables=deliverables; p.startingPrice=Math.min(...p.packages.map(x=>Number(x.price||x.rate)||999999),999999);ffWriteJson(FF_MKT_PROFILES_KEY,ffMktProfiles)}}
// Add clear navigation entries to the existing account sidebar. Customer accounts get a separate marketplace portal shell.
if($('#mainNav')&&!$('#marketplaceNav'))$('#mainNav').insertAdjacentHTML('afterbegin',`<button class="nav-item" id="marketplaceNav" data-page="marketplace">${ico('search',17)} Discover marketplace <span class="nav-count">222+</span></button>`);
if($('#mainNav')&&!$('#customerPortalNav'))$('#mainNav').insertAdjacentHTML('afterbegin',`<button class="nav-item" id="customerPortalNav" data-page="customerportal">${ico('users',17)} Client portal</button>`);
const ffApplyRoleUiBeforeMarketplace=ffApplyRoleUi;
ffApplyRoleUi=function(){ffApplyRoleUiBeforeMarketplace();const role=ffCurrentUser?.role||'';const m=$('#marketplaceNav'),c=$('#customerPortalNav');if(m)m.style.display=['owner','manager','employee','customer'].includes(role)?'flex':'none';if(c)c.style.display=role==='customer'?'flex':'none';};
const ffRenderBeforeMarketplace=renderPage;
pageMeta.marketplace=['Discover','Event marketplace'];pageMeta.customerportal=['Client account','My event plan'];
renderPage=function(){if(currentPage==='marketplace'){const p=$('#pageContent');p.className='page-content';p.innerHTML=ffMktSelectedId?ffMktRenderProfile(ffMktProvider(ffMktSelectedId)):ffMktRenderHome();return}if(currentPage==='customerportal'){const p=$('#pageContent');p.className='page-content';p.innerHTML=ffMktRenderCustomerPortal();return}return ffRenderBeforeMarketplace()};
const ffSetPageBeforeMarketplace=setPage;
setPage=function(page){const isPublic=page==='marketplace'||page==='customerportal';if(isPublic){ffOriginalSetPage(page);if($('#authGate'))$('#authGate').style.display='none';document.body.style.overflow='';document.body.classList.add('ff-public-mode');if($('#sidebar'))$('#sidebar').style.display='none';if($('#mainArea')){$('#mainArea').style.marginLeft='0';$('#mainArea').style.width='100%'}if($('#topbar'))$('#topbar').style.display='none';try{history.replaceState(null,'',page==='marketplace'?'#marketplace':'#customerportal')}catch(_){}return}document.body.classList.remove('ff-public-mode');ffSetPageBeforeMarketplace(page);if($('#sidebar'))$('#sidebar').style.display=ffCurrentUser?.role==='customer'?'none':'';if($('#mainArea')){$('#mainArea').style.marginLeft=ffCurrentUser?.role==='customer'?'0':'';$('#mainArea').style.width=ffCurrentUser?.role==='customer'?'100%':''}if($('#topbar'))$('#topbar').style.display=page==='storefront'?'none':'flex'};
function ffMktEnsureDemoWorkspace(user){if(!user||!user.demoMarketplace||!String(user.orgId||'').startsWith('org-ffm-'))return;const key='feastflow_workspace_'+user.orgId;let existing=ffReadJson(key,null);if(existing?.business&&Array.isArray(existing.business.serviceVerticals))return;const org=ffOrgs.find(o=>o.id===user.orgId)||{id:user.orgId,name:user.businessName||'Demo event business',ownerEmail:user.email,plan:user.plan||'Starter'};const i=Number(org.providerIndex)||Number(String(user.orgId).match(/(\d+)$/)?.[1])||1;const profile=ffMktProfiles.find(p=>(p.orgId||p.id)===user.orgId);const verticals=profile?.serviceVerticals?.length?profile.serviceVerticals:ffMktVerticalsFor(i);const cityObj=ffMktCities.find(c=>c[0]===profile?.city&&c[1]===profile?.state)||ffMktPick(ffMktCities,(i*13+Math.floor(i/3))%ffMktCities.length);const w=ffMktGenerateWorkspace(i,org,org.name||user.businessName||'Demo event business',user.name,user.email,verticals,cityObj);w.business.published=true;w.business.marketRating=profile?.rating||4.7;if(!ffWriteJson(key,w)){const compact=ffDefaultWorkspace(org.name||user.businessName,user.name,user.email,false);Object.assign(compact.business,w.business);['menus','packages','clients','enquiries','events','employees','inventory','transactions','activity','suppliers'].forEach(k=>compact[k]=(w[k]||[]).slice(0,k==='events'?5:k==='clients'?5:k==='transactions'?5:8));compact.serviceWorkspaces=w.serviceWorkspaces;ffWriteJson(key,compact)}if(!ffReadJson(key,null))toast('The browser storage limit prevented the full sample workspace from being saved. Clear old demo data and try again.','error')}
const ffStartSessionBeforeMarketplace=ffStartSession;
ffStartSession=function(user,options={}){if(user?.role==='owner')ffMktEnsureDemoWorkspace(user);const ok=ffStartSessionBeforeMarketplace(user,options);if(ok&&user?.role==='customer'){ffMktClientTab='overview';setPage('customerportal')}return ok};
const ffCreateSignupBeforeMarketplace=ffCreateSignupAccount;
ffCreateSignupAccount=function(form){const fd=new FormData(form),role=String(fd.get('role')||'owner');if(role!=='customer')return ffCreateSignupBeforeMarketplace(form);const name=String(fd.get('name')||'').trim(),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||''),confirm=String(fd.get('confirmPassword')||'');if(!name||!email||!password)return toast('Complete your name, email and password.','error');if(password.length<6)return toast('Use at least 6 characters for this demo password.','error');if(password!==confirm)return toast('Passwords do not match.','error');if(ffFindUser(email))return toast('That email already has a local account. Sign in instead.','error');const user={id:uid('CLIENT'),name,email,password,role:'customer',orgId:'',businessName:'FeastFlow Client',plan:'Free',status:'Active',createdAt:new Date().toISOString(),lastLogin:'',lastActive:'',isSeeded:false};ffUsers.unshift(user);ffSaveUsers();const all=ffMktGetClientStore();all[`user:${email}`]={profile:{name,email,phone:'',city:'Coimbatore',state:'Tamil Nadu',preferredEvents:[]},favourites:all['guest:local']?.favourites||[],plan:all['guest:local']?.plan||[],requests:all['guest:local']?.requests||[],bookings:[],notifications:[]};ffWriteJson(FF_MKT_CLIENTS_KEY,all);ffLog('Customer account created','Independent client portal profile created in local prototype',email,'success');ffStartSession(user);};
const ffAuthViewBeforeMarketplace=ffAuthView;
ffAuthView=function(mode='login',notice=''){ffAuthViewBeforeMarketplace(mode,notice);const card=$('.ff-auth-card');if(card&&!card.querySelector('[data-action="mkt-open"]')){const btn=document.createElement('button');btn.type='button';btn.className='btn btn-secondary';btn.style.cssText='width:100%;justify-content:center;margin:5px 0 12px';btn.dataset.action='mkt-open';btn.innerHTML='Explore the provider marketplace without signing in →';const tabs=card.querySelector('.ff-auth-modes');if(tabs)tabs.insertAdjacentElement('afterend',btn);else card.appendChild(btn)}};
const ffSignOutBeforeMarketplace=ffSignOut;
ffSignOut=function(){ffSignOutBeforeMarketplace();document.body.classList.remove('ff-public-mode');if($('#sidebar'))$('#sidebar').style.display='';if($('#mainArea')){$('#mainArea').style.marginLeft='';$('#mainArea').style.width=''}if($('#topbar'))$('#topbar').style.display='flex'};
// Keep the public catalogue in step with a business owner’s service and brand configuration.
const ffSaveServiceCatalogBeforeMarketplace=ffSaveServiceCatalog;
ffSaveServiceCatalog=function(form){ffSaveServiceCatalogBeforeMarketplace(form);ffMktSyncCurrentBusiness()};
const ffHandleActionBeforeMarketplace=handleAction;
function ffMktHandleAction(action,el){const id=el.dataset.id||'',pkg=el.dataset.package||'',data=()=>ffMktClientData();switch(action){case'mkt-open':case'mkt-back-home':ffMktSelectedId='';$('#authGate').style.display='none';document.body.style.overflow='';setPage('marketplace');return true;case'mkt-workspace':if(ffCurrentUser&&['owner','manager','employee'].includes(ffCurrentUser.role))setPage(ffCurrentUser.role==='employee'?'employee':'dashboard');else{ffAuthView('login')}return true;case'mkt-login':modalClose();ffAuthView('login');return true;case'mkt-signup':modalClose();ffAuthView('signup');return true;case'mkt-customer-portal':if(ffCurrentUser?.role==='customer'){setPage('customerportal')}else{modalClose();ffAuthView('login',{type:'success',text:'Sign in with a customer account to manage requests and your event plan.'})}return true;case'mkt-view-provider':ffMktSelectedId=id;ffMktProfileTab='overview';setPage('marketplace');return true;case'mkt-back-list':ffMktSelectedId='';setPage('marketplace');return true;case'mkt-profile-tab':ffMktProfileTab=el.dataset.tab||'overview';renderPage();return true;case'mkt-category':ffMktFilters.vertical=el.dataset.vertical||'All services';ffMktPage=1;ffMktSelectedId='';setPage('marketplace');return true;case'mkt-clear-filters':ffMktResetFilters();return true;case'mkt-page':ffMktPage=Math.max(1,Number(el.dataset.pageNum)||1);renderPage();return true;case'mkt-fav':ffMktToggleFavourite(id);return true;case'mkt-add-plan':ffMktAddPlan(id,pkg);return true;case'mkt-quote':ffMktOpenQuote(id,pkg);return true;case'mkt-customer-tab':ffMktClientTab=el.dataset.tab||'overview';setPage('customerportal');return true;case'mkt-remove-plan':{const d=data();d.plan=d.plan.filter(x=>x.id!==id);ffMktSaveClientData(d);renderPage();toast('Removed from event plan');return true}case'mkt-remove-request':{const d=data();d.requests=d.requests.filter(x=>x.id!==id);ffMktSaveClientData(d);renderPage();toast('Removed from local request history');return true}case'mkt-save-client-profile':{const d=data();d.profile={...(d.profile||{}),name:$('#mcpName')?.value||ffCurrentUser.name,phone:$('#mcpPhone')?.value||'',city:$('#mcpCity')?.value||'',state:$('#mcpState')?.value||'',preferredEvents:($('#mcpEvents')?.value||'').split(',').map(x=>x.trim()).filter(Boolean)};ffMktSaveClientData(d);toast('Client profile saved in this browser');renderPage();return true}case'mkt-logout':ffSignOut();return true;}return false}
handleAction=function(action,el){if(ffMktHandleAction(action,el))return;return ffHandleActionBeforeMarketplace(action,el)};
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='mktHeroForm'){e.preventDefault();ffMktFilters.vertical=$('#mktHeroVertical')?.value||'All services';ffMktFilters.city=$('#mktHeroCity')?.value||'All India';ffMktFilters.eventType=$('#mktHeroEvent')?.value||'All occasions';ffMktFilters.query=$('#mktSearch')?.value||ffMktFilters.query;ffMktSelectedId='';ffMktPage=1;renderPage();return;}},true);
document.addEventListener('input',e=>{const t=e.target;if(t?.id==='mktSearch'){ffMktFilters.query=t.value;ffMktPage=1;const sh=$('#ffMktResultsShell');if(sh)sh.innerHTML=ffMktResultsMarkup();return}if(t?.id==='mktGuests'){ffMktFilters.guests=t.value;const sh=$('#ffMktResultsShell');if(sh)sh.innerHTML=ffMktResultsMarkup();return}},true);
document.addEventListener('change',e=>{const t=e.target;if(t?.id==='mktVertical')ffMktFilters.vertical=t.value;else if(t?.id==='mktCity')ffMktFilters.city=t.value;else if(t?.id==='mktEventType')ffMktFilters.eventType=t.value;else if(t?.id==='mktBudget')ffMktFilters.budget=t.value;else if(t?.id==='mktCuisine')ffMktFilters.cuisine=t.value;else if(t?.id==='mktGuests')ffMktFilters.guests=t.value;else if(t?.id==='mktSort')ffMktFilters.sort=t.value;else return;ffMktPage=1;renderPage();},true);
// Marketplace login can be entered from the auth gate or a public hash.
if($('#authGate')&&$('#authGate').style.display!=='none')ffAuthView('login');
if(ffInitialRouteHash.startsWith('#marketplace')){$('#authGate').style.display='none';document.body.style.overflow='';ffMktSelectedId='';setPage('marketplace')}
else if(ffInitialRouteHash.startsWith('#customerportal')){if(ffCurrentUser?.role==='customer'){setPage('customerportal')}else{$('#authGate').style.display='none';setPage('customerportal')}}
else if(ffCurrentUser?.role==='customer'){setPage('customerportal')}
else if(currentPage==='superadmin'){renderPage()}

})();
</script>
