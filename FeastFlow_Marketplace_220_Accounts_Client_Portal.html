const d=demos[module]||demos.qa;modalOpen(d.title,d.sub,`<form id="modalForm">${d.body}</form>`,form=>{const data=new FormData(form);const summary=[];for(const [k,v] of data.entries()){if(k==='password')continue;summary.push(`${k}: ${v}`)}modalClose();toast(`${d.title}: demo state saved`);if(module==='import')toast('Validation preview: 21 valid · 2 duplicates · 1 row needs correction');if(module==='auth'&&data.get('flow')==='Forgot password')toast('Password reset preview shown; no email sent');if(module==='notifications')toast('Notification queued in demo mode; no message sent');if(module==='qa')toast('Walkthrough checklist progress saved for this session');}, {wide:true,submitLabel:d.submit||'Save demo'});
}
function renderPage(){const p=$('#pageContent');if(currentPage!=='storefront')p.className='page-content';else p.className='page-content';const routes={dashboard:renderDashboard,storefront:renderStorefront,menus:renderMenus,portfolio:renderPortfolio,clients:renderClients,events:renderEvents,quotations:renderQuotations,team:renderTeam,inventory:renderInventory,finance:renderFinance,reports:renderReports,employee:renderEmployee,settings:renderSettings,prototype:renderPrototypeCoverage};p.innerHTML=(routes[currentPage]||renderDashboard)();bindPage();updatePersistentChrome()}
function updatePersistentChrome(){$('#sideBusinessName').textContent=state.business.name;$('#sideOwner').textContent=state.business.owner;$('#enquiryCount').textContent=state.enquiries.filter(q=>['New','Contacted'].includes(q.status)).length;$('#globalSearch').value=globalQuery}
function pageHead(kicker,title,desc,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`}function panelHead(title,desc='',action=''){return `<div class="panel-head"><div><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}function statCard(label,value,foot,icon,progress=65){return `<div class="stat-card"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${ico(icon,18)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div><div class="stat-line"><span style="width:${progress}%"></span></div></div>`}
function filtered(arr,selector){if(!globalQuery.trim())return arr;const q=globalQuery.toLowerCase();return arr.filter(x=>selector(x).toLowerCase().includes(q))}
function renderDashboard(){const ev=state.events.filter(e=>e.status!=='Cancelled');const confirmed=ev.filter(e=>['Confirmed','Preparing','In progress'].includes(e.status));const monthKey=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;const monthIncome=state.transactions.filter(t=>t.type==='income'&&t.date.startsWith(monthKey)).reduce((a,t)=>a+t.amount,0);const out=ev.reduce((a,e)=>a+eventBalance(e),0);const low=state.inventory.filter(i=>i.stock<=i.threshold);const qPending=state.events.filter(e=>['Enquiry','Quotation','Negotiation'].includes(e.status)).length;const monthly=buildMonthlySeries();const max=Math.max(1,...monthly.map(m=>m.income),...monthly.map(m=>m.expenses));return `${pageHead('Monday, '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long'}),'A thoughtful day starts with a clear plan.','Your live business snapshot, upcoming service commitments and team readiness.',`<button class="btn btn-secondary" data-action="export-report">${ico('download',15)} Export summary</button><button class="btn btn-primary" data-action="new-event">${ico('plus',15)} Create event</button>`)}
<div class="grid stats-grid">${statCard('Confirmed & active events',String(confirmed.length).padStart(2,'0'),`<span class="trend">${upcomingEvents().length} upcoming</span> across your calendar`,'calendar',74)}${statCard('Received this month',money(monthIncome),`<span class="trend">${state.transactions.filter(t=>t.type==='income'&&t.date.startsWith(monthKey)).length} receipts</span> recorded this month`,'wallet',62)}${statCard('Client balances due',money(out),`${state.events.filter(e=>eventBalance(e)>0&&e.status!=='Cancelled').length} bookings with a balance`,'receipt',43)}${statCard('Active team members',state.employees.filter(e=>e.status==='Active').length,`${low.length} inventory items need attention`,'users',81)}</div>
<div class="grid two-col"><section class="panel panel-pad">${panelHead('Cash flow at a glance','Recorded receipts and expenses · last 6 months',`<div class="tabs"><button class="tab active" data-action="chart-mode" data-mode="cash">Cash flow</button><button class="tab" data-action="chart-mode" data-mode="net">Net movement</button></div>`)}<div class="chart-legend"><span><i class="legend-dot" style="background:#2d7155"></i>Money in</span><span><i class="legend-dot" style="background:#d9a17c"></i>Money out</span></div><div class="chart-wrap"><canvas id="cashChart" aria-label="Six month cash flow chart"></canvas></div><div class="flex justify-between" style="border-top:1px solid #edf0ed;padding-top:13px;margin-top:4px"><div><div class="stat-label">Income recorded</div><strong style="font-size:15px">${money(state.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0))}</strong></div><div><div class="stat-label">Expenses recorded</div><strong style="font-size:15px">${money(state.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0))}</strong></div><div><div class="stat-label">Net movement</div><strong style="font-size:15px;color:var(--forest)">${money(state.transactions.reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0))}</strong></div></div></section>
<section class="panel panel-pad">${panelHead('Kitchen & operations watch','Items that need a decision today')}${low.length?low.slice(0,4).map(i=>`<div class="alert-card"><div class="alert-icon">${ico('alert',16)}</div><div style="flex:1"><strong>${escapeHtml(i.name)} · ${i.stock} ${escapeHtml(i.unit)} left</strong><p>Preferred minimum ${i.threshold} ${escapeHtml(i.unit)} · ${escapeHtml(i.supplier)}</p></div><button class="link-btn" data-action="purchase-stock" data-id="${i.id}">Restock</button></div>`).join(''):'<div class="subtle-note">Inventory levels look healthy. Keep purchases and upcoming events updated for an accurate forecast.</div>'}<div style="border-top:1px solid #edf1ed;margin-top:14px;padding-top:14px">${panelHead('Lead follow-up','Keep active conversations moving',`<button class="link-btn" data-page="clients">View leads →</button>`)}${state.enquiries.filter(q=>['New','Contacted'].includes(q.status)).slice(0,2).map(q=>`<div class="activity-item"><span class="activity-dot">${ico('message',15)}</span><div class="activity-text"><strong>${escapeHtml(q.name)}</strong><div>${escapeHtml(q.eventType)} · ${q.guests} guests · ${fmtShort(q.date)}</div><small>${escapeHtml(q.status)} · ${escapeHtml(q.source)}</small></div><button class="btn btn-secondary btn-sm" data-action="view-enquiry" data-id="${q.id}">Review</button></div>`).join('')||'<p class="muted" style="font-size:11px">No active lead follow-ups.</p>'}</div></section></div>
<div class="grid two-col mt-16"><section class="panel panel-pad">${panelHead('Coming up next','Your next confirmed and quoted events',`<button class="link-btn" data-page="events">Open calendar →</button>`)}${upcomingEvents().slice(0,5).map(e=>`<div class="event-row"><div class="date-chip"><strong>${new Date(e.date+'T00:00:00').getDate()}</strong><span>${new Date(e.date+'T00:00:00').toLocaleDateString('en-IN',{month:'short'})}</span></div><div class="event-main"><strong>${escapeHtml(e.title)}</strong><small>${escapeHtml(e.venue)} · ${e.guests} guests</small><div style="margin-top:6px">${badge(e.status)}</div></div><div class="event-meta"><strong>${money(eventTotal(e))}</strong><small>${escapeHtml(e.time)} · ${escapeHtml(clientName(e.clientId))}</small></div><button class="icon-btn btn-icon" data-action="view-event" data-id="${e.id}" title="Open event">${ico('chevron',15)}</button></div>`).join('')||'<div class="empty-state">No upcoming events recorded.</div>'}</section>
<section class="panel panel-pad">${panelHead('Recent activity','A running record of important changes',`<button class="link-btn" data-action="show-alerts">View all →</button>`)}${state.activity.slice(0,5).map(a=>`<div class="activity-item"><span class="activity-dot">${ico(a.icon||'check',15)}</span><div class="activity-text"><strong>${escapeHtml(a.title)}</strong><div>${escapeHtml(a.detail)}</div><small>${fmtShort(a.date)}</small></div></div>`).join('')}</section></div>
<div class="grid three-col mt-16"><section class="panel panel-pad">${panelHead('Event pipeline','Where upcoming work stands')}${[['Enquiry',state.events.filter(e=>e.status==='Enquiry').length,'#8fa9ce'],['Quotation',state.events.filter(e=>e.status==='Quotation').length,'#e1b96c'],['Confirmed',state.events.filter(e=>e.status==='Confirmed').length,'#76a88a'],['Completed',state.events.filter(e=>e.status==='Completed').length,'#9ab3a4']].map(([name,num,col])=>`<div class="progress-row"><div class="progress-label"><span>${name}</span><span>${num}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,num/Math.max(1,state.events.length)*100)}%;background:${col}"></div></div></div>`).join('')}</section><section class="panel panel-pad">${panelHead('Staffing readiness','Active people by role')}${state.employees.filter(e=>e.status==='Active').slice(0,4).map(e=>`<div class="event-row"><div class="mini-avatar">${initials(e.name)}</div><div class="event-main"><strong>${escapeHtml(e.name)}</strong><small>${escapeHtml(e.role)}</small></div>${badge(e.availability||'Available')}</div>`).join('')}<button class="btn btn-secondary w-full mt-16" data-page="team">Manage team</button></section><section class="panel panel-pad">${panelHead('Business shortcuts','Get to common tasks quickly')}<div class="grid" style="grid-template-columns:1fr 1fr;gap:9px"><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-quote">${ico('receipt',16)} Build quote</button><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-client">${ico('users',16)} Add client</button><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-menu">${ico('utensils',16)} Add dish</button><button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-action="new-expense">${ico('wallet',16)} Record cost</button></div><div class="subtle-note" style="margin-top:14px">Keep event details, stock usage and payments current so your reports reflect your actual operating position.</div></section></div>`}
function buildMonthlySeries(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({key,label:d.toLocaleDateString('en-IN',{month:'short'}),income:state.transactions.filter(t=>t.type==='income'&&t.date?.startsWith(key)).reduce((a,t)=>a+t.amount,0),expenses:state.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(key)).reduce((a,t)=>a+t.amount,0)})}return months}
function drawCashChart(mode='cash'){const c=$('#cashChart');if(!c)return;const ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,p={l:48,r:10,t:14,b:29};ctx.clearRect(0,0,w,h);const arr=buildMonthlySeries(),maxVal=Math.max(...arr.map(a=>mode==='net'?Math.abs(a.income-a.expenses):Math.max(a.income,a.expenses)),10000)*1.15;ctx.font='10px system-ui';ctx.fillStyle='#89958c';ctx.textAlign='right';ctx.strokeStyle='#edf1ed';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=p.t+(h-p.t-p.b)*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke();const val=maxVal*(4-i)/4;ctx.fillText(val>=100000?'₹'+(val/100000).toFixed(1)+'L':val>=1000?'₹'+Math.round(val/1000)+'k':'₹'+Math.round(val),p.l-8,y+3)}const chartH=h-p.t-p.b,chartW=w-p.l-p.r,step=chartW/arr.length;arr.forEach((a,i)=>{const center=p.l+step*i+step/2;if(mode==='net'){const value=a.income-a.expenses,base=p.t+chartH/2;ctx.strokeStyle='#e6ece7';ctx.beginPath();ctx.moveTo(p.l,base);ctx.lineTo(w-p.r,base);ctx.stroke();const bh=Math.abs(value)/maxVal*chartH*1.8;ctx.fillStyle=value>=0?'#477f61':'#d18a6c';ctx.beginPath();ctx.roundRect(center-step*.22,value>=0?base-bh:base,step*.44,bh,5);ctx.fill()}else{const bw=Math.min(17,step*.26),hi=a.income/maxVal*chartH,he=a.expenses/maxVal*chartH;ctx.fillStyle='#2d7155';ctx.beginPath();ctx.roundRect(center-bw-2,p.t+chartH-hi,bw,hi,4);ctx.fill();ctx.fillStyle='#d9a17c';ctx.beginPath();ctx.roundRect(center+2,p.t+chartH-he,bw,he,4);ctx.fill()}ctx.fillStyle='#7f8b82';ctx.textAlign='center';ctx.fillText(a.label,center,h-8)})}

function recipeText(recipe=[]){return (recipe||[]).map(r=>`${r.item} | ${r.perGuest} | ${r.unit}`).join('\n')}function parseRecipeRows(value){return String(value||'').split(/\r?\n/).map(line=>line.split('|').map(x=>x.trim())).filter(parts=>parts[0]&&Number(parts[1])>0&&parts[2]).map(parts=>({item:parts[0],perGuest:Number(parts[1]),unit:parts[2]}))}function projectedInventoryUsage(){const usage={};const add=(menu,servings,multiplier=1)=>{(menu?.recipe||[]).forEach(r=>{const item=state.inventory.find(i=>i.name.toLowerCase()===String(r.item).toLowerCase());if(!item||String(item.unit).toLowerCase()!==String(r.unit).toLowerCase())return;usage[item.id]=(usage[item.id]||0)+(Number(r.perGuest)||0)*servings*multiplier})};upcomingEvents().forEach(ev=>{const pkg=currentPackage(ev.packageId);(pkg?.includes||[]).forEach(name=>{const menu=state.menus.find(m=>m.name===name);const perGuest=/per guest|per plate/i.test(menu?.unit||'');add(menu,perGuest?(Number(ev.guests)||0):1)});(ev.menuSelections||[]).forEach(sel=>{const menu=state.menus.find(m=>m.id===sel.menuId);const perGuest=/per guest|per plate/i.test(menu?.unit||'');add(menu,perGuest?(Number(ev.guests)||0):(Number(sel.quantity)||0),perGuest?(Number(sel.quantity)||0):1)})});return usage}

function quoteHtml(e){const b=state.business,c=currentClient(e.clientId),pack=currentPackage(e.packageId),sub=eventSubtotal(e),total=eventTotal(e),tax=total-sub;return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quotation QT-${e.id.replace('EV','')} · ${escapeHtml(b.name)}</title><style>body{font-family:Arial,sans-serif;color:#26382d;margin:0;background:#f3f6f3;font-size:13px}.sheet{max-width:850px;margin:30px auto;background:white;padding:42px 48px;box-shadow:0 10px 50px #0001}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #214938;padding-bottom:24px}.logo{font-family:Georgia,serif;font-size:25px;color:#214938;font-weight:bold}.muted{color:#79877e;font-size:11px;line-height:1.7}.right{text-align:right}.title{margin:28px 0 20px;display:flex;justify-content:space-between;align-items:end}.title h1{margin:0;font-size:28px}.badge{display:inline-block;background:#e8f3ea;color:#2c6b44;padding:5px 9px;border-radius:6px;font-size:10px;font-weight:bold}.details{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}.details h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#829087;margin:0 0 9px}.details strong{display:block;margin:5px 0}.details p{margin:4px 0;color:#657268}.rows{width:100%;border-collapse:collapse}.rows th{text-align:left;color:#829087;font-size:10px;text-transform:uppercase;border-bottom:1px solid #e2eae3;padding:11px 8px}.rows td{padding:12px 8px;border-bottom:1px solid #edf1ed}.rows th:last-child,.rows td:last-child{text-align:right}.totals{width:310px;margin:17px 0 0 auto}.line{display:flex;justify-content:space-between;padding:7px 0;color:#67776b}.line.total{border-top:2px solid #214938;font-weight:bold;font-size:17px;color:#214938;margin-top:5px;padding-top:12px}.terms{background:#f5f8f5;border-radius:9px;padding:15px;margin-top:25px;color:#69796e;font-size:11px;line-height:1.8}.footer{margin-top:28px;border-top:1px solid #e4ebe5;padding-top:16px;display:flex;justify-content:space-between;gap:15px;color:#859188;font-size:10px}@media(max-width:600px){.sheet{padding:20px;margin:0}.top,.details,.title{flex-direction:column}.right{text-align:left}.totals{width:100%}}@media print{body{background:white}.sheet{margin:0;box-shadow:none;max-width:none;padding:20px 25px}}</style></head><body><main class="sheet"><header class="top"><div><div class="logo">${escapeHtml(b.name)}</div><div class="muted">${escapeHtml(b.tagline||'Catering with care')}<br>${escapeHtml(b.address)}, ${escapeHtml(b.city)}, ${escapeHtml(b.state)} ${escapeHtml(b.pincode)}<br>${escapeHtml(b.phone)} · ${escapeHtml(b.email)}</div></div><div class="right"><div style="font-weight:bold">QUOTATION</div><div class="muted">QT-${e.id.replace('EV','')}<br>Issued: ${fmtDate(dateOffset(0))}<br>Valid for ${Number(b.quoteValidity)||7} days</div></div></header><div class="title"><div><div class="muted">Prepared for</div><h1>${escapeHtml(c?.name||'Valued client')}</h1></div><span class="badge">${escapeHtml(e.status)}</span></div><section class="details"><div><h3>Event details</h3><strong>${escapeHtml(e.title)}</strong><p>${escapeHtml(e.type)} · ${fmtDate(e.date)}</p><p>${escapeHtml(e.time)}${e.endTime?' – '+escapeHtml(e.endTime):''} · ${e.guests} guests</p><p>${escapeHtml(e.venue)}</p></div><div><h3>Package & service</h3><strong>${escapeHtml(pack?.name||'Custom catering service')}</strong><p>${escapeHtml(pack?.description||'Custom menu and service selection')}</p><p>${escapeHtml(pack?.cuisine||'Mixed')} · ${money(e.rate)} per guest</p><p>${escapeHtml((pack?.includes||[]).join(', '))}</p></div></section><table class="rows"><thead><tr><th>Service description</th><th>Calculation</th><th>Amount</th></tr></thead><tbody><tr><td><strong>Food package</strong><div class="muted">${escapeHtml(pack?.name||'Catering menu')}</div></td><td>${e.guests} × ${money(e.rate)}</td><td>${money(e.guests*e.rate)}</td></tr>${menuSelectionQuoteRow function openQuote(id){const e=eventById(id);if(!e)return;const sub=eventSubtotal(e),total=eventTotal(e),tax=total-sub;modalOpen(`Quotation QT-${e.id.replace('EV','')}`,`${clientName(e.clientId)} · ${escapeHtml(e.title)}`,`<div class="flex justify-between align-center" style="gap:10px;margin-bottom:17px"><div><div class="eyebrow">Quotation summary</div><div style="font-size:12px;color:#69776d">${fmtDate(e.date)} · ${e.guests} guests · ${escapeHtml(e.venue)}</div></div>${badge(e.status)}</div><div class="grid two-col" style="gap:10px;margin-bottom:17px"><div class="report-box"><label>Quotation total</label><strong>${money(total)}</strong><small>${money(e.paid)} recorded as received</small></div><div class="report-box"><label>${eventCredit(e)>0?'Client credit':'Balance remaining'}</label><strong>${money(eventCredit(e)>0?eventCredit(e):eventBalance(e))}</strong><small>${eventCredit(e)>0?'Payments exceed the revised quotation':'Due before / after event as per terms'}</small></div></div><div class="table-wrap"><table><thead><tr><th>Line item</th><th>Basis</th><th>Amount</th></tr></thead><tbody><tr><td><strong>Food package</strong></td><td>${e.guests} × ${money(e.rate)}</td><td>${money(e.guests*e.rate)}</td></tr>${menuSelectionQuoteRows(e)}<tr><td>Additional services / manual extras</td><td>Flat</td><td>${money(e.extras)}</td></tr><tr><td>Staffing</td><td>Flat</td><td>${money(e.staffCost)}</td></tr><tr><td>Transport</td><td>Flat</td><td>${money(e.transport)}</td></tr><tr><td>Equipment rentals</td><td>Flat</td><td>${money(e.rentals)}</td></tr><tr><td>Other charges</td><td>Flat</td><td>${money(e.other)}</td></tr><tr><td>Discount</td><td>Flat</td><td>−${money(e.discount)}</td></tr><tr><td>Subtotal</td><td>Before tax</td><td>${money(sub)}</td></tr><tr><td>Tax</td><td>${Number(e.taxRate)||0}% configured</td><td>${money(tax)}</td></tr><tr><td><strong>Total</strong></td><td></td><td><strong>${money(total)}</strong></td></tr></tbody></table></div><div class="subtle-note" style="m function assignmentFormMarkup(defaults={}){const e=eventById(defaults.eventId)||state.events.find(x=>x.status!=='Cancelled'&&x.date>=dateOffset(0))||state.events[0];const emp=state.employees.find(x=>x.id===defaults.employeeId)||state.employees.find(x=>x.status==='Active');const existing=e?.staffAssignments?.find(a=>a.employeeId===(defaults.employeeId||''));return `<div class="form-grid">${field('Event','eventId',e?.id||'','select',{required:true,options:state.events.filter(x=>x.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({value:x.id,label:`${x.title} · ${fmtShort(x.date)} · ${x.guests} guests`}))})}${field('Employee','employeeId',emp?.id||'','select',{required:true,options:state.employees.filter(x=>x.status==='Active').map(x=>({value:x.id,label:x.name+' · '+x.role}))})}${field('Assigned duty','role',existing?.role||emp?.role||'Service crew','text',{required:true})}${field('Assignment status','status',existing?.status||'Assigned','select',{options:['Assigned','Awaiting acceptance','Confirmed','Declined','Completed'].map(x=>({value:x,label:x}))})}${field('Reporting time','startTime',existing?.startTime||e?.time||'08:00','time',{required:true})}${field('Shift end','endTime',existing?.endTime||e?.endTime||'16:00','time',{required:true})}${field('Task checklist (one task per line)','tasks',(existing?.tasks||[{name:'Review event brief',done:false},{name:'Complete assigned service setup',done:false}]).map(t=>t.name).join('\n'),'textarea',{full:true,rows:4,hint:'Existing completed tasks are retained when the same employee is reassigned.'})}</div>`}
function openAssignmentForm(defaults={}){modalOpen('Allocate employee to an event','Assign a role and shift, and give staff a clear checklist for the service.',assignmentFormMarkup(defaults),form=>{const d=Object.fromEntries(new FormData(form).entries()),ev=eventById(d.eventId),emp=state.employees.find(x=>x.id===d.employeeId);if(!ev||!emp){toast('Choose an event and employee','error');return}ev.staffAssignments ||= [];const existing=ev.staffAssignments.find(a=>a.employeeId===emp.id);const tasks=String(d.tasks||'').split('\n').map(s=>s.trim()).filter(Boolean).map((name,i)=>({name,done:existing?.tasks?.find(t=>t.name===name)?.done||false}));const clash=state.events.some(other=>other.id!==ev.id&&other.status!=='Cancelled'&&other.date===ev.date&&(other.staffAssignments||[]).some(a=>a.employeeId===emp.id&&a.status!=='Declined'&&overlaps(d.startTime,d.endTime,a.startTime,a.endTime)));if(clash&&!confirm(`${emp.name} is already assigned to another event on ${fmtDate(ev.date)} with an overlapping shift. Save this allocation anyway?`))return;const assignment={employeeId:emp.id,role:d.role,startTime:d.startTime,endTime:d.endTime,status:d.status,checkedIn:existing?.checkedIn||false,tasks};if(existing)Object.assign(existing,assignment);else ev.staffAssignments.push(assignment);persist();modalClose();renderPage();toast(existing?'Staff assignment updated':'Staff allocated to event');addActivity('Staff allocation saved',`${emp.name} · ${ev.title}`,'users')},{submitLabel:'Save allocation',onOpen:()=>{const form=$('#modalForm');form.elements.eventId.addEventListener('change',()=>{const ev=eventById(form.elements.eventId.value);if(ev){if(form.elements.startTime&&!form.elements.startTime.value)form.elements.startTime.value=ev.time;if(form.elements.endTime&&!form.elements.endTime.value)form.elements.endTime.value=ev.endTime}});form.elements.employeeId.addEventListener('change',()=>{const emp=state.employees.find(x=>x.id===form.elements.employeeId.value);if(emp&&!form.elements.role.value)form.elements.role.value=emp.role})}})}
function overlaps(s1,e1,s2,e2){const m=s=>{const [h,mn]=String(s||'00:00').split(':').map(Number);return h*60+mn};return m(s1)<m(e2)&&m(s2)<m(e1)}

function calendarMarkup(){const first=new Date(selectedYear,selectedMonth,1),last=new Date(selectedYear,selectedMonth+1,0),start=(first.getDay()+6)%7,total=Math.ceil((start+last.getDate())/7)*7;let html=`<div class="flex justify-between align-center" style="margin-bottom:14px"><button type="button" class="btn btn-secondary btn-sm" data-action="calendar-prev">← Previous</button><strong>${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</strong><button type="button" class="btn btn-secondary btn-sm" data-action="calendar-next">Next →</button></div><div class="calendar-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="calendar-cell head">${x}</div>`).join('')}`;for(let i=0;i<total;i++){const day=i-start+1,inMonth=day>=1&&day<=last.getDate(),date=`${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const evs=inMonth?state.events.filter(e=>e.date===date&&e.status!=='Cancelled'):[];html+=`<div class="calendar-cell" style="${!inMonth?'background:#fafbfa;opacity:.4':''}"><div class="flex justify-between align-center"><span class="day-num">${inMonth?day:''}</span>${inMonth?`<button type="button" style="border:0;background:none;color:#829087;padding:0;font-size:14px" data-action="calendar-add" data-date="${date}" title="Add event">+</button>`:''}</div>${evs.map(e=>`<button type="button" class="calendar-event ${['Enquiry','Quotation','Negotiation'].includes(e.status)?'pending':e.type==='Corporate'?'other':''}" title="${escapeHtml(e.title)}" data-action="view-event" data-id="${e.id}">${escapeHtml(e.title)}</button>`).join('')}</div>`}html+='</div><div class="flex gap-8" style="margin-top:13px;flex-wrap:wrap;font-size:10px;color:#7e8a82"><span><i class="legend-dot" style="background:#76a88a"></i>Confirmed / completed</span><span><i class="legend-dot" style="background:#e1b96c"></i>Enquiry / quotation</span><span><i class="legend-dot" style="background:#d99c7b"></i>Corporate / other events</span></div>';return html}
function openCalendar(){modalOpen('Event calendar','Review event dates, navigate between months and create a record from a specific day.',calendarMarkup(),null,{wide:true,viewOnly:true,footer:`<button type="button" class="btn btn-secondary" data-action="close-modal">Close calendar</button><div class="right-actions"><button type="button" class="btn btn-primary" data-action="new-event">${ico('plus',14)} Create event</button></div>`})}

function bindFileUpload(fileId,hiddenId){const input=$('#'+fileId),hidden=$('#'+hiddenId);if(!input||!hidden)return;input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const url=await compressImage(file,1200,850,.76);hidden.value=url;toast('Photo ready to save')}catch(e){toast('Could not read that image. Try another file.','error')}})}
function bindMultiFileUpload(fileId,hiddenId){const input=$('#'+fileId),hidden=$('#'+hiddenId);if(!input||!hidden)return;input.addEventListener('change',async()=>{const files=Array.from(input.files||[]);if(!files.length)return;try{const urls=[];for(const file of files.slice(0,8))urls.push(await compressImage(file,1200,850,.74));let old=[];try{old=JSON.parse(hidden.value||'[]')}catch(e){}hidden.value=JSON.stringify([...old,...urls]);toast(`${urls.length} photo${urls.length===1?'':'s'} ready to save`)}catch(e){toast('Could not load one of these images. Try another file.','error')}})}
function compressImage(file,maxW=1200,maxH=850,quality=.75){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}

function csvCell(v){let s=String(v??'');if(typeof v==='string'&&/^[\s]*[=+\-@]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}function exportCsv(filename,rows){const text=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');exportFile(filename,'\ufeff'+text,'text/csv;charset=utf-8');toast('CSV export downloaded')}

async function ffReadFile(file){
  if(/\.xlsx?$/i.test(file.name)){
    if(!window.XLSX){
      await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Excel reader could not load. Use CSV while offline, or reconnect and try again.'));document.head.appendChild(sc);});
    }
    const bytes=await file.arrayBuffer(),wb=XLSX.read(bytes,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
  }
  const text=await file.text(),first=text.split(/\r?\n/,1)[0]||'',delimiter=first.includes('\t')?'\t':',';
  return ffParseDelimited(text,delimiter);
}
async function ffHandleImportFile(file){

}

function executeBulkImport(){

  if(action==='record-stock-usage'){modalClose();openStockUsageForm();return;}

function ffStartSession(user,options={}){
  if(!user||user.status==='Suspended'){toast('This account is suspended. Ask the Superadmin to reactivate it.','error');return false}
  if(user.role==='owner'&&user.orgId){const org=ffOrgs.find(o=>o.id===user.orgId);if(org&&org.status==='Suspended'){toast('This business workspace is suspended by Superadmin.','error');return false}}
  ffCurrentUser=user;ffActiveOrgId=user.orgId||'';
  if(user.orgId)ffLoadWorkspace(user.orgId);
  user.lastLogin=new Date().toISOString();user.lastActive=user.lastLogin;ffSaveUsers();
  ffWriteJson(FF_SESSION_KEY,{userId:user.id,startedAt:new Date().toISOString()});
  ffLog('Sign in',`${ffRoleLabel(user.role)} signed in`,user.email,'success');
  $('#authGate').style.display='none';document.body.style.overflow='';
  ffApplyRoleUi();const firstPage=user.role==='superadmin'?'superadmin':user.role==='customer'?'storefront':user.role==='employee'?'employee':'dashboard';
  setPage(firstPage);toast(`Welcome, ${user.name}`);
  if(options.showOnboarding&&user.role==='owner')openOnboarding({name:state.business.name,owner:state.business.owner,email:user.email});
  return true;
}

const ffOriginalHandleAction=handleAction;

  if(action==='admin-export-users'){

function ffSWGo(vertical,tab='overview'){ffSWVertical=vertical;ffSWTab=tab;ffSWEnsure(vertical);setPage('serviceworkspaces')}
function ffSWTabs(){return [['overview','Overview'],['packages','Packages & pricing'],['resources','Equipment / assets'],['team','Team & capacity'],['deliverables','Deliverables & workflow'],['bookings','Bookings / jobs'],['reservations','Reservations'],['settings','Service configuration']]}
function ffSWPackageMarkup(p){return `<article class="ff-sw-package"><div class="ff-sw-package-top"><span class="ff-sw-plan-chip">${ffEsc(p.status||'Draft')}</span><span class="ff-sw-price">${ffSWMoney(p.price)} <small>${ffEsc(p.pricingBasis||'per job')}</small></span></div><h4>${ffEsc(p.name)}</h4><p>${ffEsc(p.measure||p.duration||'Flexible service scope')} · ${ffEsc(p.capacity||'Capacity agreed per brief')}</p><div class="ff-sw-inclusions"><strong>Included</strong><p>${ffEsc(p.inclusions||'Not set')}</p></div><div class="ff-sw-package-foot"><span>Deposit ${Number(p.depositPercent)||0}%</span><button class="btn btn-secondary btn-sm" data-action="sw-edit-package" data-id="${ffEsc(p.id)}">Edit package</button></div></article>`}
function ffSWRenderOverview(v,w,p){const done=w.deliverables.filter(x=>x.status==='Completed').length;const activeJobs=w.bookings.filter(x=>!['Completed','Cancelled'].includes(x.status)).length;const totalStock=w.resources.reduce((a,x)=>a+(Number(x.quantity)||0),0);const available=w.resources.reduce((a,x)=>a+Math.max(0,(Number(x.quantity)||0)-(Number(x.reserved)||0)),0);return `<div class="ff-sw-stats"><div class="ff-sw-stat"><span>Packages & rates</span><strong>${w.packages.length}</strong><small>${w.packages.filter(x=>x.status==='Published').length} visible to quote</small></div><div class="ff-sw-stat"><span>Assets / capacity</span><strong>${totalStock}</strong><small>${available} currently unreserved ${ffEsc(p.resourceTitle.toLowerCase())}</small></div><div class="ff-sw-stat"><span>Team / specialists</span><strong>${w.team.length}</strong><small>${w.team.filter(x=>x.availability==='Available').length} shown as available</small></div><div class="ff-sw-stat"><span>Open jobs</span><strong>${activeJobs}</strong><small>${w.bookings.length} total service bookings</small></div></div><div class="ff-sw-overview-grid"><section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>Packages customers can book</h3><p>These hold the real commercial scope: pricing basis, inclusions, add-ons, delivery promise and exclusions.</p></div><button class="btn btn-primary btn-sm" data-action="sw-add-package">${ico('plus',13)} Add package</button></div><div class="ff-sw-package-grid">${w.packages.slice(0,3).map(ffSWPackageMarkup).join('')||'<div class="empty-state">No packages yet. Create the first sellable package for this service line.</div>'}</div><button class="btn btn-secondary" style="margin-top:13px" data-action="service-workspace-tab" data-tab="packages">Manage all packages →</button></section><section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>Service delivery checklist</h3><p>Reusable standards for preparation, execution, delivery and close-out.</p></div><button class="btn btn-secondary btn-sm" data-action="service-workspace-tab" data-tab="deliverables">Manage workflow</button></div>${w.deliverables.slice(0,4).map(d=>`<div class="ff-sw-check-row"><div class="ff-sw-check-icon">${d.status==='Completed'?'✓':'○'}</div><div class="ff-sw-check-main"><strong>${ffEsc(d.name)}</strong><small>${ffEsc(d.phase)} · ${ffEsc(d.owner||'Service lead')}</small></div><span class="status ${statusClass(d.status)}">${ffEsc(d.status)}</span></div>`).join('')}<div class="ff-sw-completion"><div class="ff-sw-meter"><span style="width:${Math.round(done/Math.max(1,w.deliverables.length)*100)}%"></span></div><small>${done} of ${w.deliverables.length} deliverables completed</small></div></section><section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>${ffEsc(p.resourceTitle)}</h3><p>Track quantity, location, condition, availability and rates—not just a checkbox.</p></div><button class="btn btn-secondary btn-sm" data-action="sw-add-resource">${ico('plus',13)} Add asset</button></div>${w.resources.slice(0,5).map(r=>`<div class="ff-sw-resource-row"><div class="ff-sw-resource-symbol">${p.icon}</div><div class="ff-sw-resource-main"><strong>${ffEsc(r.name)}</strong><small>${ffEsc(r.type)} · ${Number(r.quantity)||0} ${ffEsc(r.unit||'units')} · ${ffEsc(r.details||'')}</small></div><span class="status ${statusClass(r.status)}">${ffEsc(r.status||'Available')}</span></div>`).join('')}</section><section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>Upcoming service bookings</h3><p>Each job has a package, scope, date, assigned lead and delivery status.</p></div><button class="btn btn-primary btn-sm" data-action="sw-add-booking">${ico('plus',13)} New job</button></div>${w.bookings.slice(0,4).map(b=>`<div class="ff-sw-booking-row"><div><strong>${ffEsc(b.title)}</strong><small>${ffEsc(b.client||'Client not added')} · ${ffEsc(fmtShort(b.date))} · ${ffEsc(b.packageName||'Custom scope')}</small></div><div class="ff-sw-booking-right"><strong>${ffSWMoney(b.estimate)}</strong><span class="status ${statusClass(b.status)}">${ffEsc(b.status)}</span></div></div>`).join('')||'<div class="ff-sw-emptyline">No service jobs yet. Create a job here and optionally add it to the main Events calendar.</div>'}</section></div>`}
function ffSWRenderPackages(w,p){return `<section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>${ffEsc(p.packageTitle)}</h3><p>Every package stores its own scope, price basis, capacity, inclusions, add-ons, exclusions, lead time and deposit. These can drive quotations and client approval later.</p></div><button class="btn btn-primary" data-action="sw-add-package">${ico('plus',14)} Create package</button></div><div class="ff-sw-package-grid">${w.packages.map(ffSWPackageMarkup).join('')||'<div class="empty-state">No packages created. Add an offer with clear scope and pricing.</div>'}</div><div class="ff-sw-info-note"><strong>Service-specific example:</strong> ${ffEsc(p.example[0])} includes scope and limits for this business line. Add-ons and exclusions reduce misunderstandings and unapproved scope growth.</div></section>`}
function ffSWRenderResources(w,p){return `<section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>${ffEsc(p.resourceTitle)}</h3><p>Store each asset with type, count, unit, operating condition, availability, rate, technical details and service notes. This works for camera equipment, venues/rooms, vehicles, AV gear, furniture, kits and other service-specific capacity.</p></div><button class="btn btn-primary" data-action="sw-add-resource">${ico('plus',14)} Add resource</button></div><div class="table-wrap"><table class="ff-sw-table"><thead><tr><th>Asset / resource</th><th>Type / model & specs</th><th>Quantity</th><th>Reserved</th><th>Rate</th><th>Condition</th><th>Status</th><th>Actions</th></tr></thead><tbody>${w.resources.map(r=>`<tr><td><strong>${ffEsc(r.name)}</strong><small>${ffEsc(r.unit||'units')}</small></td><td>${ffEsc(r.type)}<small>${ffEsc(r.details||'No specifications added')}</small></td><td>${Number(r.quantity)||0}</td><td>${Number(r.reserved)||0}</td><td>${ffSWMoney(r.rate)} <small>/ ${ffEsc(r.rateBasis||'day')}</small></td><td>${ffEsc(r.condition||'Not inspected')}</td><td><span class="status ${statusClass(r.status)}">${ffEsc(r.status||'Available')}</span></td><td><div class="ff-sw-row-actions"><button class="btn btn-secondary btn-sm" data-action="sw-edit-resource" data-id="${ffEsc(r.id)}">Edit</button><button class="btn btn-secondary btn-sm" data-action="sw-reserve-resource" data-id="${ffEsc(r.id)}">Reserve</button><button class="link-btn" data-action="sw-delete-resource" data-id="${ffEsc(r.id)}">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="8">No resources yet.</td></tr>'}</tbody></table></div></section>`}
function ffSWRenderTeam(w,p){return `<section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>${ffEsc(p.crewTitle)}</h3><p>People, roles, skills, certifications, availability, contact details and cost rates. Use this to plan a team—not only maintain employee names.</p></div><button class="btn btn-primary" data-action="sw-add-crew">${ico('plus',14)} Add team member</button></div><div class="table-wrap"><table class="ff-sw-table"><thead><tr><th>Person</th><th>Role & capability</th><th>Rate</th><th>Availability</th><th>Certification / contact</th><th>Actions</th></tr></thead><tbody>${w.team.map(x=>`<tr><td><strong>${ffEsc(x.name)}</strong><small>${ffEsc(x.phone||'Contact not added')}</small></td><td>${ffEsc(x.role)}<small>${ffEsc(x.skills||'Skills not entered')}</small></td><td>${ffSWMoney(x.rate)} <small>${ffEsc(x.rateUnit||'per shift')}</small></td><td><span class="status ${statusClass(x.availability)}">${ffEsc(x.availability||'Schedule check required')}</span></td><td>${ffEsc(x.certification||'—')}</td><td><div class="ff-sw-row-actions"><button class="btn btn-secondary btn-sm" data-action="sw-edit-crew" data-id="${ffEsc(x.id)}">Edit</button><button class="link-btn" data-action="sw-delete-crew" data-id="${ffEsc(x.id)}">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="6">No team records.</td></tr>'}</tbody></table></div></section>`}
function ffSWRenderDeliverables(w,p){const rows=w.deliverables.map(d=>`<div class="ff-sw-deliverable ${d.status==='Completed'?'is-done':''}"><button class="ff-sw-toggle" data-action="sw-toggle-deliverable" data-id="${ffEsc(d.id)}" aria-label="Toggle ${ffEsc(d.name)}">${d.status==='Completed'?'✓':'○'}</button><div class="ff-sw-deliverable-main"><strong>${ffEsc(d.name)}</strong><small>${ffEsc(d.phase)} · owner: ${ffEsc(d.owner||'Unassigned')} · ${d.dueOffset<0?`${Math.abs(d.dueOffset)} days before event`:d.dueOffset===0?'Event day':`${d.dueOffset} days after event`}</small><p>${ffEsc(d.notes||'')}</p></div><span class="status ${statusClass(d.status)}">${ffEsc(d.status)}</span><button class="btn btn-secondary btn-sm" data-action="sw-edit-deliverable" data-id="${ffEsc(d.id)}">Edit</button></div>`).join('');return `<section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>Deliverables, SOP and quality gates</h3><p>Use reusable workflow steps with phase, due offset, accountable owner, completion state and evidence notes.</p></div><button class="btn btn-primary" data-action="sw-add-deliverable">${ico('plus',14)} Add workflow step</button></div><div class="ff-sw-workflow">${rows||'<div class="empty-state">No steps defined yet.</div>'}</div><div class="ff-sw-info-note">Complete each step as the work progresses. In a production system, this workflow can generate reminders, approvals and a customer-facing delivery status.</div></section>`}
function ffSWRenderBookings(w,p){return `<section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>${ffEsc(p.jobTitle)}</h3><p>Track customer, event type, date, location, selected package, quantity, estimate, assigned lead, payment notes and delivery stage.</p></div><button class="btn btn-primary" data-action="sw-add-booking">${ico('plus',14)} Create booking / job</button></div><div class="table-wrap"><table class="ff-sw-table"><thead><tr><th>Job / client</th><th>Event & date</th><th>Package / quantity</th><th>Estimate</th><th>Stage</th><th>Linked event</th><th>Actions</th></tr></thead><tbody>${w.bookings.map(b=>`<tr><td><strong>${ffEsc(b.title)}</strong><small>${ffEsc(b.client||'Client not added')} · ${ffEsc(b.owner||'Unassigned')}</small></td><td>${ffEsc(b.eventType||'Event')}<small>${ffEsc(fmtShort(b.date))} · ${ffEsc(b.location||'Location to confirm')}</small></td><td>${ffEsc(b.packageName||'Custom service')}<small>${Number(b.quantity)||1} ${ffEsc(b.quantityUnit||'jobs')}</small></td><td><strong>${ffSWMoney(b.estimate)}</strong><small>${ffEsc(b.paymentStatus||'Advance pending')}</small></td><td><span class="status ${statusClass(b.status)}">${ffEsc(b.status)}</span><div style="margin-top:6px"><button class="link-btn" data-action="sw-next-booking-stage" data-id="${ffEsc(b.id)}">Advance stage →</button></div></td><td>${b.eventId?`<span class="status completed">${ffEsc(b.eventId)}</span>`:'<span class="status pending">Not linked</span>'}</td><td><div class="ff-sw-row-actions"><button class="btn btn-secondary btn-sm" data-action="sw-edit-booking" data-id="${ffEsc(b.id)}">Edit</button><button class="link-btn" data-action="sw-delete-booking" data-id="${ffEsc(b.id)}">Cancel/remove</button></div></td></tr>`).join('')||'<tr><td colspan="7"><div class="ff-sw-emptyline">No jobs created for this service line yet. Create a sample job and link it to Events & Bookings.</div></td></tr>'}</tbody></table></div></section>`}
function ffSWRenderReservations(w,p){return `<section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>Resource reservations & availability</h3><p>Reserve quantities / capacity for a specific service job and date window. Overlapping reservations are recorded to avoid casually double-allocating demo inventory.</p></div><button class="btn btn-primary" data-action="sw-add-reservation">${ico('plus',14)} New reservation</button></div><div class="table-wrap"><table class="ff-sw-table"><thead><tr><th>Resource</th><th>Job / booking</th><th>Dates</th><th>Qty reserved</th><th>Status</th><th>Action</th></tr></thead><tbody>${w.reservations.map(r=>{const asset=w.resources.find(x=>x.id===r.resourceId),job=w.bookings.find(x=>x.id===r.bookingId);return `<tr><td><strong>${ffEsc(asset?.name||'Resource removed')}</strong><small>${ffEsc(asset?.type||'')}</small></td><td>${ffEsc(job?.title||'Booking removed')}</td><td>${ffEsc(fmtShort(r.from))} – ${ffEsc(fmtShort(r.to))}</td><td>${Number(r.quantity)||0} ${ffEsc(asset?.unit||'units')}</td><td><span class="status ${statusClass(r.status)}">${ffEsc(r.status)}</span></td><td><button class="link-btn" data-action="sw-toggle-reservation" data-id="${ffEsc(r.id)}">${r.status==='Confirmed'?'Release':'Confirm'}</button></td></tr>`}).join('')||'<tr><td colspan="6">No reservations. Add a service job first, then reserve assets or capacity against its dates.</td></tr>'}</tbody></table></div></section>`}
function ffSWRenderSettings(w,p){const fields=w.configuration.fields||[];return `<section class="panel ff-sw-panel"><div class="ff-sw-section-head"><div><h3>Configuration for ${ffEsc(w.vertical)}</h3><p>These settings are attached to this service line. A photography team can set delivery and rights policies while a transport business manages permits, fleet coverage and hotel allotments.</p></div><span class="ff-sw-plan-chip">Account-specific</span></div><form id="swConfigForm"><div class="ff-sw-config-grid"><div class="field"><label>Standard booking lead time (days)</label><input class="input" type="number" min="0" name="leadTimeDays" value="${Number(w.configuration.leadTimeDays)||0}"></div><div class="field"><label>Quotation validity (days)</label><input class="input" type="number" min="1" name="quoteValidityDays" value="${Number(w.configuration.quoteValidityDays)||14}"></div><div class="field"><label>Default advance / deposit (%)</label><input class="input" type="number" min="0" max="100" name="depositPercent" value="${Number(w.configuration.depositPercent)||0}"></div><div class="field"><label>Service coverage area</label><input class="input" name="serviceAreas" value="${ffEsc(w.configuration.serviceAreas||'')}"></div><div class="field full"><label>Cancellation / rescheduling policy</label><textarea class="input" rows="2" name="cancellationPolicy">${ffEsc(w.configuration.cancellationPolicy||'')}</textarea></div><div class="field full"><label>Travel / overtime / surcharge policy</label><textarea class="input" rows="2" name="travelPolicy">${ffEsc(w.configuration.travelPolicy||'')}</textarea></div></div><h4 class="ff-sw-subheading">Specialist settings</h4><div class="ff-sw-config-grid">${fields.map((x,i)=>`<div class="field ${i===fields.length-1?'full':''}"><label>${ffEsc(x.label)}</label><textarea class="input" rows="2" name="swField_${i}">${ffEsc(x.value||'')}</textarea></div>`).join('')}</div><div class="ff-sw-save-row"><span class="muted" style="font-size:11px">Saved to this business workspace only.</span><button type="submit" class="btn btn-primary">Save service configuration ${ico('check',14)}</button></div></form></section>`}
function ffRenderServiceWorkspaces(){const active=ffSWActiveVerticals();if(!active.length)return `${pageHead('Your service-specific workspaces','Service workspaces','Choose the business lines you operate. Each selected line creates its own operational tools, packages, inventory, crew and customer jobs.',`<button class="btn btn-primary" data-page="servicecatalog">${ico('settings',14)} Choose services</button>`)}<div class="ff-sw-landing"><div><div class="eyebrow">This account's service operating system</div><h2>Every service line gets its own workspace.</h2><p>Select a division to manage its real catalogue and delivery data. A photography business gets camera / lens inventory, coverage tiers, editing turnaround and media deliverables; transport tracks vehicles and room blocks; AV manages technical gear and show cues.</p><div class="ff-sw-landing-actions"><button class="btn btn-primary" data-page="servicecatalog">Manage enabled services</button><button class="btn btn-secondary" data-action="brand-open">Brand identity</button></div></div><div class="ff-sw-landing-count"><strong>${active.length}</strong><span>active service lines</span><small>${Object.values(state.serviceWorkspaces||{}).filter(x=>x.enabled).length} workspaces provisioned in this demo</small></div></div><div class="ff-sw-service-grid">${active.map(v=>{const p=ffSWProfile(v),w=ffSWEnsure(v);const jobs=w.bookings.length;return `<article class="ff-sw-service-card"><div class="ff-sw-card-icon">${p.icon}</div><div class="ff-sw-card-body"><div class="ff-sw-card-kicker">SERVICE DIVISION · ${w.packages.length} PACKAGES</div><h3>${ffEsc(v)}</h3><p>${ffEsc(p.summary)}</p><div class="ff-sw-card-stats"><span>${w.resources.length} resources</span><span>${w.team.length} team records</span><span>${jobs} jobs</span></div><button class="btn btn-primary btn-sm" data-action="service-workspace-open" data-vertical="${ffEsc(v)}">Open workspace ${ico('arrow-up-right',13)}</button></div></article>`}).join('')}</div><section class="ff-sw-explainer"><div><strong>What changes when a service is selected?</strong><p>It adds service-specific navigation and an operational area in the signed-in account, not just a storefront tag. The workspace stores packages, equipment/resources, people, deliverables, jobs, bookings, reservations and configuration under this account.</p></div><button class="btn btn-secondary" data-action="service-workspace-tab" data-tab="settings">Open current service settings</button></section>`}
function ffSWRender(){const active=ffSWActiveVerticals();if(!active.length)return ffRenderServiceWorkspaces();if(!active.includes(ffSWVertical))ffSWVertical=active[0];const vertical=ffSWVertical,p=ffSWProfile(vertical),w=ffSWEnsure(vertical);const content=ffSWTab==='packages'?ffSWRenderPackages(w,p):ffSWTab==='resources'?ffSWRenderResources(w,p):ffSWTab==='team'?ffSWRenderTeam(w,p):ffSWTab==='deliverables'?ffSWRenderDeliverables(w,p):ffSWTab==='bookings'?ffSWRenderBookings(w,p):ffSWTab==='reservations'?ffSWRenderReservations(w,p):ffSWTab==='settings'?ffSWRenderSettings(w,p):ffSWRenderOverview(vertical,w,p);const tabHtml=ffSWTabs().map(([id,label])=>`<button class="ff-sw-tab ${ffSWTab===id?'active':''}" data-action="service-workspace-tab" data-tab="${id}">${label}</button>`).join('');return `<div class="ff-sw-page-head"><div><div class="eyebrow">SERVICE OPERATIONS</div><h1>Service workspaces</h1><p>Each enabled division has its own packages, asset register, team, deliverables, reservations and job pipeline.</p></div><div class="ff-sw-head-actions"><button class="btn btn-secondary" data-page="servicecatalog">${ico('settings',14)} Edit service selection</button><button class="btn btn-primary" data-action="sw-add-booking">${ico('plus',14)} New service job</button></div></div><div class="ff-sw-detail-hero"><div class="ff-sw-detail-icon">${p.icon}</div><div class="ff-sw-detail-main"><div class="ff-sw-eyebrow">ENABLED BUSINESS DIVISION</div><h2>${ffEsc(vertical)}</h2><p>${ffEsc(p.summary)}</p><div class="ff-sw-chips"><span>✓ ${w.packages.length} package(s)</span><span>▣ ${w.resources.length} assets / capacity records</span><span>♙ ${w.team.length} people / roles</span><span>☷ ${w.bookings.length} jobs</span></div></div><div class="ff-sw-vertical-select"><label for="swVerticalPicker">Switch service division</label><select class="input" id="swVerticalPicker">${active.map(v=>`<option value="${ffEsc(v)}" ${v===vertical?'selected':''}>${ffEsc(v)}</option>`).join('')}</select><button class="btn btn-secondary btn-sm" data-action="service-workspace-reset-demo">Reset this service sample data</button></div></div><div class="ff-sw-tabs" role="tablist">${tabHtml}</div>${content}<div class="ff-sw-disclaimer">Prototype demo: records are saved to this business account's browser-local workspace. Resource reservations, availability and booking stages are simulated and do not contact real vendors, people, payment services or connected systems.</div>`}
function ffSWPersistAction(msg){if($('#modalBackdrop')?.classList.contains('open'))modalClose();persist();ffUpdateServiceWorkspaceNav();renderPage();toast(msg)}

else if(activeTab==='operations'){main=`<section class="ff-mkt-profile-section"><h2>Equipment, capacity & crew</h2><p>Service-specific equipment and people are part of the provider's account workspace, not just storefront labels.</p><div class="ff-mkt-data-grid">${p.resources.slice(0,12).map(r=>`<div class="ff-mkt-data-row"><span class="ico">${ffSWProfile(r.vertical||p.serviceVerticals[0]).icon||'⚙️'}</span><div><strong>${escapeHtml(r.name)}</strong><small>${escapeHtml(r.type||r.vertical||'Asset')} · Qty ${r.quantity||1} ${escapeHtml(r.unit||'units')} · ${escapeHtml(r.details||'Maintained against the service job and its reservation schedule.')}</small></div></div>`).join('')}</div><h2 style="margin-top:20px">Service team</h2><div class="ff-mkt-data-grid" style="margin-top:10px">${p.team.slice(0,12).map(t=>`<div class="ff-mkt-data-row"><span class="ico">👤</span><div><strong>${escapeHtml(t.name||t.role)}</strong><small>${escapeHtml(t.role||'Service lead')} · ${escapeHtml(t.skills||'Role-specific skills and shift scope')} · ${ffMktAmount(t.rate||0)} per shift (sample)</small></div></div>`).join('')}</div><h2 style="margin-top:20px">Workflows & deliverables</h2>${p.deliverables.slice(0,12).map(d=>`<div class="event-row"><span class="activity-dot">✓</span><div class="event-main"><strong>${escapeHtml(d.name)}</strong><small>${escapeHtml(d.phase||d.vertical||'Service delivery')} · ${escapeHtml(d.notes||'Assigned, due, checked and signed off against a job')}</small></div></div>`).join('')}</section>`}
else{main=`<section class="ff-mkt-profile-section"><h2>Customer reviews</h2><p>Sample review data included for prototype testing. It is not verified customer feedback.</p>${(p.reviews||[]).map(r=>`<div class="ff-customer-request"><div class="logo">${escapeHtml(initials(r.name))}</div><div class="info"><strong>${escapeHtml(r.name)} <span class="ff-mkt-rating">★ ${r.rating}.0</span></strong><small>${escapeHtml(r.event)} · ${escapeHtml(r.text)}</small></div></div>`).join('')}</section>`}
return `<div class="ff-mkt-shell ff-mkt-detail">${ffMktHeader()}<div class="ff-mkt-detail-top"><button class="ff-mkt-back" data-action="mkt-back-list">← Back to results</button><span>Marketplace / ${escapeHtml(p.city)} / ${escapeHtml(p.name)}</span></div><section class="ff-mkt-detail-hero" style="background-image:url('${escapeHtml(p.cover)}')"><div class="ff-mkt-detail-content"><div class="flex gap-8" style="flex-wrap:wrap"><span class="ff-mkt-demo-chip">SAMPLE DEMO STOREFRONT</span><span class="ff-mkt-demo-chip">${p.serviceCount} service divisions</span></div><h1>${escapeHtml(p.name)}</h1><p>${escapeHtml(p.tagline||p.description)}</p><div class="ff-mkt-detail-metas"><span>★ ${p.rating.toFixed(1)} · ${p.reviewCount} sample reviews</span><span>⌖ ${escapeHtml(p.city)}, ${escapeHtml(p.state)}</span><span>↗ ${p.replyRate}% sample response rate</span></div></div></section><div class="ff-mkt-profile-wrap"><main class="ff-mkt-profile-main"><div class="ff-mkt-profile-tabs">${[['overview','Overview'],['packages','Packages & menus'],['operations','Equipment & team'],['reviews','Reviews']].map(([id,label])=>`<button class="${activeTab===id?'active':''}" data-action="mkt-profile-tab" data-tab="${id}">${label}</button>`).join('')}</div>${main}</main><aside class="ff-mkt-detail-aside"><div class="flex gap-8 align-center" style="margin-bottom:12px"><div class="ff-mkt-logo">${ffMktLogo(p)}</div><div style="min-width:0"><strong style="font-size:12px;display:block">${escapeHtml(p.name)}</strong><small style="color:#859188;font-size:9px">${escapeHtml(p.city)}, ${escapeHtml(p.state)}</small></div></div><div class="big-price">${ffMktAmount(p.startingPrice)}</div><p>Lowest listed sample package. Final rates depend on scope, dates, guest count, service location and custom inclusions.</p><div class="event-row"><div class="event-main"><strong>Response time</strong><small>${p.replyMins<60?p.replyMins+' minutes':Math.round(p.replyMins/60)+' hours'} (sample)</small></div></div><div class="event-row"><div class="event-main"><strong>Guest / order range</strong><small>${p.minGuests}–${p.maxGuests.toLocaleString('en-IN')}</small></div></div><button class="btn btn-primary" data-action="mkt-quote" data-id="${escapeHtml(p.id)}">Request a custom quote</button><button class="btn btn-secondary" data-action="mkt-add-plan" data-id="${escapeHtml(p.id)}" data-package="${escapeHtml(packages[0]?.id||'')}">Add to event plan</button><button class="btn btn-secondary" data-action="mkt-fav" data-id="${escapeHtml(p.id)}">${isFav?'♥ Saved provider':'♡ Save provider'}</button><div class="subtle-note" style="margin-top:12px;font-size:9px">Requests are stored in this prototype and copied into the selected provider’s local enquiry workspace.</div></aside></div></div>`}
function ffMktPackage(p,x){return `<article class="ff-mkt-package"><div class="ff-mkt-tags"><span class="ff-mkt-tag">${escapeHtml(x.vertical||p.serviceVerticals[0])}</span><span class="ff-mkt-tag">${escapeHtml(x.status||'Sample package')}</span></div><h3>${escapeHtml(x.name||'Service package')}</h3><div class="price">${ffMktAmount(x.price||x.rate||0)} <small style="font-size:9px;font-weight:650;color:#819087">${escapeHtml(ffMktPackageLabel(x))}</small></div><p>${escapeHtml(x.inclusions||x.description||x.measure||'Scope and inclusions agreed with the client before booking.')}</p><p><strong>Included / deliverables:</strong> ${escapeHtml(x.addOns||((x.services||[]).join(' · '))||'Checklisted in the service job and delivery workflow.')}</p><div class="ff-mkt-package-foot"><small style="color:#7a887e;font-size:9px">Deposit / date subject to quote</small><button data-action="mkt-quote" data-id="${escapeHtml(p.id)}" data-package="${escapeHtml(x.id||'')}">Request quote</button></div></article>`}
function ffMktOpenQuote(providerId,packageId=''){const p=ffMktProvider(providerId);if(!p)return;const pkg=p.packages.find(x=>x.id===packageId)||p.packages[0];const user=ffCurrentUser?.role==='customer'?ffCurrentUser:null;const body=`<div class="alert-card"><div class="alert-icon">${ico('message',16)}</div><div><strong>Send a quote request to ${escapeHtml(p.name)}</strong><p>The request will appear in your client portal and be added to the provider’s local enquiries. No payment is taken.</p></div></div><div class="form-grid" style="margin-top:14px">${field('Your name','mqtName',user?.name||'','text',{required:true})}${field('Email address','mqtEmail',user?.email||'','email',{required:true})}${field('Phone / WhatsApp','mqtPhone',ffMktClientData().profile.phone||'','tel',{required:true})}${field('Service / package','mqtPackage',pkg?.id||'','select',{options:p.packages.map(x=>({value:x.id,label:`${x.name} · ${ffMktAmount(x.price||x.rate||0)}`})),full:true})}${field('Event / occasion','mqtEventType',ffMktFilters.eventType!=='All occasions'?ffMktFilters.eventType:(p.eventTypes[0]||'Wedding'),'select',{options:ffAllEventTypes.map(x=>({value:x,label:x})),required:true})}${field('Event date','mqtDate',dateOffset(30),'date',{required:true})}${field('City / venue area','mqtCity',ffMktFilters.city!=='All India'?ffMktFilters.city:p.city,'text',{required:true})}${field('Expected guests / units','mqtGuests',Math.max(100,p.minGuests),'number',{min:1,required:true})}${field('Budget range (₹)','mqtBudget',p.startingPrice*2,'number',{min:0})}${field('Tell the provider what you need','mqtNotes',`Interested in ${pkg?.name||p.serviceVerticals[0]}. Please confirm availability, inclusions, taxes, travel, deposit, cancellation terms and deliverables.`,'textarea',{full:true,rows:4})}<div class="field full"><label class="check-label"><input type="checkbox" name="mqtUpdates" checked> Allow this prototype to show the request in my local client account and provider inbox</label></div></div>`;modalOpen('Request a service quote',`${p.name} · ${p.city}, ${p.state}`,body,form=>{const d=Object.fromEntries(new FormData(form));const title=String(d.mqtName||'').trim(),email=String(d.mqtEmail||'').trim().toLowerCase(),phone=String(d.mqtPhone||'').trim();if(!title||!email||!phone)return toast('Add your name, email and phone to send the request.','error');const selected=p.packages.find(x=>x.id===d.mqtPackage)||pkg;const data=ffMktClientData();if(ffCurrentUser?.role==='customer'){data.profile={...(data.profile||{}),name:ffCurrentUser.name,email:ffCurrentUser.email,phone,city:d.mqtCity||p.city}}const req={id:uid('REQ'),providerId:p.id,orgId:p.orgId||p.id,providerName:p.name,providerCity:p.city,vertical: selected?.vertical||p.serviceVerticals[0],packageId:selected?.id||'',packageName:selected?.name||p.serviceVerticals[0],eventType:d.mqtEventType,date:d.mqtDate,city:d.mqtCity,guests:Number(d.mqtGuests)||0,budget:Number(d.mqtBudget)||0,notes:d.mqtNotes||'',contactName:title,email,phone,status:'Sent to provider (demo)',createdAt:new Date().toISOString(),source:'FeastFlow marketplace'};data.requests.unshift(req);ffMktSaveClientData(data);ffMktSaveProviderInquiry(p,req);modalClose();toast('Quote request sent in the prototype.');if(ffCurrentUser?.role==='customer'){ffMktClientTab='requests';setPage('customerportal')}else{modalOpen('Request saved','Your quote request has been recorded in this browser. Create a client account to manage requests in a dedicated portal.',`<div class="subtle-note">${escapeHtml(p.name)} received a sample enquiry for ${escapeHtml(req.eventType)} on ${escapeHtml(req.date)}. The provider’s demo workspace contains this lead now.</div><div class="flex gap-8" style="margin-top:16px;flex-wrap:wrap"><button class="btn btn-primary" type="button" data-action="mkt-signup">Create client account</button><button class="btn btn-secondary" type="button" data-action="mkt-back-list">Continue browsing</button></div>`,null,{viewOnly:true,footer:''});}}, {wide:true,submitLabel:'Send quote request'});}
function ffMktSaveProviderInquiry(p,req){const key='feastflow_workspace_'+(p.orgId||p.id);let w=ffReadJson(key,null);if(!w&&String(p.orgId||'').startsWith('org-ffm-')){const demoOwner=ffUsers.find(u=>u.demoMarketplace&&u.role==='owner'&&u.orgId===(p.orgId||p.id));if(demoOwner){ffMktEnsureDemoWorkspace(demoOwner);w=ffReadJson(key,null)}}if(!w)return;if(!Array.isArray(w.enquiries))w.enquiries=[];if(!Array.isArray(w.clients))w.clients=[];if(!Array.isArray(w.activity))w.activity=[];let c=w.clients.find(x=>String(x.email||'').toLowerCase()===req.email.toLowerCase());if(!c){c={id:uid('C'),name:req.contactName,phone:req.phone,email:req.email,source:'FeastFlow marketplace',events:0,notes:'Customer from marketplace enquiry.'};w.clients.unshift(c)}w.enquiries.unshift({id:uid('Q'),name:req.contactName,phone:req.phone,email:req.email,eventType:req.eventType,date:req.date,guests:req.guests,source:'FeastFlow marketplace',budget:req.budget,message:`${req.packageName}. ${req.notes}`,status:'New',created:dateOffset(0),clientId:c.id,marketplaceRequestId:req.id,serviceVertical:req.vertical});w.activity.unshift({id:uid('A'),icon:'message',title:'New marketplace quote request',detail:`${req.contactName} · ${req.eventType} · ${req.providerName}`,date:dateOffset(0)});ffWriteJson(key,w)}
function ffMktToggleFavourite(id){const d=ffMktClientData(),idx=d.favourites.indexOf(id);if(idx>=0)d.favourites.splice(idx,1);else d.favourites.unshift(id);ffMktSaveClientData(d);if(currentPage==='customerportal')renderPage();else if(ffMktSelectedId)renderPage();else{const shell=$('#ffMktResultsShell');if(shell)shell.innerHTML=ffMktResultsMarkup();else renderPage()}toast(idx>=0?'Removed from saved businesses':'Saved business to your list')}
function ffMktAddPlan(id,packageId=''){const p=ffMktProvider(id);if(!p)return;const pkg=p.packages.find(x=>x.id===packageId)||p.packages[0];const d=ffMktClientData();if(d.plan.some(x=>x.providerId===id&&x.packageId===(pkg?.id||''))){toast('That package is already in your event plan.','info');return}d.plan.unshift({id:uid('PLAN'),providerId:p.id,providerName:p.name,packageId:pkg?.id||'',packageName:pkg?.name||p.serviceVerticals[0],price:Number(pkg?.price||pkg?.rate||p.startingPrice),vertical:pkg?.vertical||p.serviceVerticals[0],city:p.city,addedAt:new Date().toISOString()});ffMktSaveClientData(d);toast('Added to your event plan');renderPage()}

fMktCustomerEmpty('Your plan is empty','Save catering, venues, photography and more into one event plan.','mkt-open')}</div></section></div><section class="ff-customer-card" style="margin-top:15px">${ffMktCustomerCardHeader('Suggested next step','Continue exploring every service you need for the event.','<button class="btn btn-primary btn-sm" data-action="mkt-open">Explore marketplace →</button>')}<div class="ff-customer-card-body"><div class="ff-mkt-tags">${ffServiceVerticals.slice(0,8).map(v=>`<button class="ff-mkt-tag" style="cursor:pointer" data-action="mkt-category" data-vertical="${escapeHtml(v[0])}">${escapeHtml(v[0])}</button>`).join('')}</div><p class="hint" style="margin-top:12px">You can manage service vendors separately, without committing the full event scope. A quote request is not a confirmed booking.</p></div></section>`}
else if(activeTab==='requests'){body=`<section class="ff-customer-card">${ffMktCustomerCardHeader('All quote requests','The request status and provider details stored in your local client account.')}<div class="ff-customer-card-body">${reqs.length?reqs.map(ffMktRequestRow).join(''):ffMktCustomerEmpty('No requests to track','Send a quote request from any provider shop.','mkt-open')}</div></section>`}
else if(activeTab==='plan'){body=`<section class="ff-customer-card">${ffMktCustomerCardHeader('Your event plan','Keep the providers and package scopes you are considering in one place.','<button class="btn btn-primary btn-sm" data-action="mkt-open">Add more services</button>')}<div class="ff-customer-card-body">${plan.length?plan.map(ffMktPlanRow).join('')+`<div class="subtle-note" style="margin-top:14px">Estimated listed value: <strong>${ffMktAmount(plan.reduce((a,x)=>a+(Number(x.price)||0),0))}</strong>. This is not a quote or an amount payable.</div>`:ffMktCustomerEmpty('No saved packages','Open a provider shop and choose “Add to event plan”.','mkt-open')}</div></section>`}
else if(activeTab==='saved'){body=`<section class="ff-customer-card">${ffMktCustomerCardHeader('Saved businesses','Businesses you bookmarked to revisit.','<button class="btn btn-secondary btn-sm" data-action="mkt-open">Find providers</button>')}<div class="ff-customer-card-body">${favs.length?favs.map(p=>`<div class="ff-customer-request"><div class="logo">${ffMktLogo(p)}</div><div class="info"><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.serviceVerticals.slice(0,3).join(' · '))}<br>⌖ ${escapeHtml(p.city)}, ${escapeHtml(p.state)} · ★ ${p.rating.toFixed(1)}</small><div class="flex gap-8" style="margin-top:8px"><button class="btn btn-secondary btn-sm" data-action="mkt-view-provider" data-id="${escapeHtml(p.id)}">View shop</button><button class="btn btn-primary btn-sm" data-action="mkt-quote" data-id="${escapeHtml(p.id)}">Request quote</button><button class="btn btn-quiet btn-sm" data-action="mkt-fav" data-id="${escapeHtml(p.id)}">Unsave</button></div></div></div>`).join(''):ffMktCustomerEmpty('No saved businesses','Tap the heart on a provider listing to keep it here.','mkt-open')}</div></section>`}
else{body=`<section class="ff-customer-card">${ffMktCustomerCardHeader('Client profile','Manage your contact information and common event preferences.')}<div class="ff-customer-card-body"><div class="form-grid">${field('Full name','mcpName',prof.name||ffCurrentUser.name,'text')}${field('Email address','mcpEmail',ffCurrentUser.email,'email',{disabled:true})}${field('Phone / WhatsApp','mcpPhone',prof.phone||'','tel')}${field('Home / preferred city','mcpCity',prof.city||'Coimbatore','text')}${field('State','mcpState',prof.state||'Tamil Nadu','text')}${field('Common event types','mcpEvents',(prof.preferredEvents||[]).join(', '),'text',{full:true,placeholder:'Wedding, Birthday, Corporate events'})}</div><button class="btn btn-primary" style="margin-top:15px" data-action="mkt-save-client-profile">Save profile</button><p class="hint" style="margin-top:10px">Client details are stored locally in this prototype. Never use real sensitive account credentials here.</p></div></section>`}
return `<div class="ff-customer-shell"><header class="ff-customer-top"><button class="ff-customer-brand" data-action="mkt-open"><span class="mark">F</span><span><strong>FeastFlow</strong><small>Client portal</small></span></button><div class="ff-customer-actions"><button data-action="mkt-open">${ico('search',13)} Discover services</button><button data-action="mkt-customer-tab" data-tab="plan">Event plan (${plan.length})</button><button class="primary" data-action="mkt-logout">${ico('external',13)} Sign out</button></div></header><main class="ff-customer-main"><div class="ff-customer-welcome"><div><span class="ff-mkt-kicker">CLIENT ACCOUNT</span><h1>Welcome back, ${escapeHtml((prof.name||ffCurrentUser.name||'there').split(' ')[0])}.</h1><p>Keep catering, venues, decoration, photography and every other service together while you plan your event.</p></div><button class="btn btn-primary" data-action="mkt-open">Find a service ${ico('arrow',14)}</button></div><div class="ff-customer-stats"><div class="ff-customer-stat"><small>Quote requests</small><strong>${reqs.length}</strong><span>Sent to providers in demo</span></div><div class="ff-customer-stat"><small>Saved businesses</small><strong>${d.favourites.length}</strong><span>Shop pages bookmarked</span></div><div class="ff-customer-stat"><small>Planned services</small><strong>${plan.length}</strong><span>Packages to compare</span></div><div class="ff-customer-stat"><small>Planned value</small><strong style="font-size:20px">${ffMktAmount(plan.reduce((a,x)=>a+(Number(x.price)||0),0))}</strong><span>Indicative only</span></div></div><div class="ff-customer-tabs">${ffMktCustomerTabs().map(([id,label])=>`<button class="${activeTab===id?'active':''}" data-action="mkt-customer-tab" data-tab="${id}">${label}</button>`).join('')}</div>${body}</main><footer class="ff-mkt-footer"><div><strong>FeastFlow client portal</strong><p>Quote requests and event plan records are stored locally in this prototype. No payments are processed and requests do not confirm provider availability.</p></div><div class="demo-note"><strong style="font:800 11px system-ui">Demo profile</strong><p>Marketplace accounts, reviews and prices are synthetic sample data, not verified live businesses.</p></div></footer></div>`}
